[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-net-recovery"
version = "0.2.0"
description = "MSAL orchestration, validation and recovery checks for self-hosted applications"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "home-network-platform contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
auth = ["msal==1.38.0", "requests==2.34.2", "cryptography==50.0.1"]

[project.scripts]
home-net-recovery = "home_net_recovery.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["home_net_recovery*", "home_net_auth*", "home_net_validation*"]
